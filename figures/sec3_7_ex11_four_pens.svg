<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="620" height="220" style="background-color: #ffffff; display: block; margin: 0 auto;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db2777" />
  </marker>
  <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" />
  </marker>
</defs>

    <!-- Left Panel: Sample Explorations -->
    <rect x="15" y="15" width="260" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="145" y="36" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Part (a): Sample Configurations</text>
    
    <!-- Shallow / Wide: x = 50, y = 250 => 5(50)+2(250)=750, Area = 12,500 -->
    <rect x="35" y="55" width="220" height="30" fill="#ecfdf5" stroke="#dc2626" stroke-width="2" />
    <line x1="90" y1="55" x2="90" y2="85" stroke="#dc2626" stroke-width="1.8" />
    <line x1="145" y1="55" x2="145" y2="85" stroke="#dc2626" stroke-width="1.8" />
    <line x1="200" y1="55" x2="200" y2="85" stroke="#dc2626" stroke-width="1.8" />
    <text x="145" y="73" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" fill="#047857" font-weight="600" text-anchor="middle">Shallow: x = 50, y = 250 → Area = 12,500 ft²</text>

    <!-- Deep / Narrow: x = 100, y = 125 => 5(100)+2(125)=750, Area = 12,500 -->
    <rect x="75" y="105" width="140" height="60" fill="#ecfdf5" stroke="#dc2626" stroke-width="2" />
    <line x1="110" y1="105" x2="110" y2="165" stroke="#dc2626" stroke-width="1.8" />
    <line x1="145" y1="105" x2="145" y2="165" stroke="#dc2626" stroke-width="1.8" />
    <line x1="180" y1="105" x2="180" y2="165" stroke="#dc2626" stroke-width="1.8" />
    <text x="145" y="138" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" fill="#047857" font-weight="600" text-anchor="middle">Deep: x = 100, y = 125</text>
    <text x="145" y="152" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" fill="#047857" font-weight="600" text-anchor="middle">Area = 12,500 ft²</text>

    <text x="145" y="190" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Estimate: Max area ≥ 12,500 ft²</text>

    <!-- Right Panel: General 4-Pen Model -->
    <rect x="295" y="15" width="310" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="450" y="36" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Part (b): General Four-Pen Model</text>

    <!-- Outer rectangle -->
    <rect x="330" y="65" width="240" height="85" fill="#f0fdf4" stroke="#dc2626" stroke-width="2.5" />
    <!-- 3 Internal Dividers (5 vertical fence segments total) -->
    <line x1="390" y1="65" x2="390" y2="150" stroke="#dc2626" stroke-width="2.2" />
    <line x1="450" y1="65" x2="450" y2="150" stroke="#dc2626" stroke-width="2.2" />
    <line x1="510" y1="65" x2="510" y2="150" stroke="#dc2626" stroke-width="2.2" />

    <!-- Pen labels -->
    <text x="360" y="112" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" fill="#15803d" font-weight="600" text-anchor="middle">Pen 1</text>
    <text x="420" y="112" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" fill="#15803d" font-weight="600" text-anchor="middle">Pen 2</text>
    <text x="480" y="112" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" fill="#15803d" font-weight="600" text-anchor="middle">Pen 3</text>
    <text x="540" y="112" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" fill="#15803d" font-weight="600" text-anchor="middle">Pen 4</text>

    <!-- Dimension annotations -->
    <text x="450" y="56" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#1e293b" text-anchor="middle">y (width)</text>
    <text x="318" y="112" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#1e293b" text-anchor="end">x</text>
    
    <text x="450" y="175" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Constraint: 5x + 2y = 750  ⇒  y = 375 − 2.5x</text>
    <text x="450" y="193" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">Max Area at x = 75 ft, y = 187.5 ft: A = 14,062.5 ft²</text>
    
</svg>