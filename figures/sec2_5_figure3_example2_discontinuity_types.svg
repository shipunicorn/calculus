<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" style="background-color: #ffffff; display: block; margin: 0 auto;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db2777" />
  </marker>
  <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
  </marker>
</defs>

    <g>
      <!-- Subtitle -->
      <text x="30" y="28" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0f172a">(a) Removable Discontinuity: f(x) = (x² - x - 2) / (x - 2)</text>
      <!-- Axes -->
      <line x1="30" y1="160" x2="270" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="120" y1="220" x2="120" y2="40" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="275" y="172" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">x</text>
      <text x="108" y="45" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">y</text>
      <text x="110" y="172" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">0</text>
      
      <!-- Ticks -->
      <line x1="176" y1="157" x2="176" y2="163" stroke="#1e293b" />
      <text x="173" y="174" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">2</text>
      <line x1="117" y1="76" x2="123" y2="76" stroke="#1e293b" />
      <text x="108" y="80" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">3</text>
      <line x1="117" y1="132" x2="123" y2="132" stroke="#1e293b" />
      <text x="108" y="136" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">1</text>

      <!-- Guidelines -->
      <line x1="176" y1="160" x2="176" y2="76" stroke="#94a3b8" stroke-dasharray="3 3" />
      <line x1="120" y1="76" x2="176" y2="76" stroke="#94a3b8" stroke-dasharray="3 3" />

      <!-- Line y = x + 1 with hole at (2, 3) -->
      <line x1="50.0" y1="202.0" x2="172.64" y2="79.36" stroke="#0284c7" stroke-width="2.2" />
      <line x1="179.36" y1="72.64" x2="237.60000000000002" y2="14.400000000000006" stroke="#0284c7" stroke-width="2.2" />
      <circle cx="176" cy="76" r="3.5" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
      <text x="184" y="78" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">(2, 3) hole</text>
    </g>
    
    <g>
      <!-- Subtitle -->
      <text x="350" y="28" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0f172a">(b) Infinite Discontinuity: f(x) = 1/x²</text>
      <!-- Axes -->
      <line x1="330" y1="160" x2="570" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="440" y1="190" x2="440" y2="40" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="575" y="172" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">x</text>
      <text x="428" y="45" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">y</text>
      <text x="430" y="172" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">0</text>

      <!-- Curve y = 1/x^2 -->
      <path d="M 344.0 157.0 Q 410.0 130.0, 431.0 46.0"
            fill="none" stroke="#0284c7" stroke-width="2.2" />
      <path d="M 536.0 157.0 Q 470.0 130.0, 449.0 46.0"
            fill="none" stroke="#0284c7" stroke-width="2.2" />

      <!-- Point (0, 1) -->
      <line x1="437" y1="130" x2="443" y2="130" stroke="#1e293b" />
      <text x="428" y="134" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">1</text>
      <circle cx="440" cy="130" r="3.5" fill="#0284c7" />
      <text x="448" y="134" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">(0, 1)</text>
      <text x="460" y="64.0" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" fill="#e11d48">x = 0 Asymptote</text>
    </g>
    
    <g>
      <!-- Subtitle -->
      <text x="30" y="258" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0f172a">(c) Removable (Displaced Point): f(2) = 1</text>
      <!-- Axes -->
      <line x1="30" y1="390" x2="270" y2="390" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="120" y1="450" x2="120" y2="270" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="275" y="402" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">x</text>
      <text x="108" y="275" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">y</text>
      <text x="110" y="402" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">0</text>

      <!-- Ticks -->
      <line x1="176" y1="387" x2="176" y2="393" stroke="#1e293b" />
      <text x="173" y="404" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">2</text>
      <line x1="117" y1="306" x2="123" y2="306" stroke="#1e293b" />
      <text x="108" y="310" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">3</text>
      <line x1="117" y1="362" x2="123" y2="362" stroke="#1e293b" />
      <text x="108" y="366" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">1</text>

      <!-- Guidelines -->
      <line x1="176" y1="390" x2="176" y2="306" stroke="#94a3b8" stroke-dasharray="3 3" />
      <line x1="120" y1="306" x2="176" y2="306" stroke="#94a3b8" stroke-dasharray="3 3" />

      <!-- Line y = x + 1 with hole at (2, 3) -->
      <line x1="50.0" y1="432.0" x2="172.64" y2="309.36" stroke="#0284c7" stroke-width="2.2" />
      <line x1="179.36" y1="302.64" x2="237.60000000000002" y2="244.4" stroke="#0284c7" stroke-width="2.2" />
      <circle cx="176" cy="306" r="3.5" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />

      <!-- Displaced point at (2, 1) -->
      <circle cx="176" cy="362" r="3.5" fill="#0284c7" />
      <text x="184" y="366" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" fill="#0284c7">f(2) = 1</text>
      <text x="184" y="308" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">(2, 3) hole</text>
    </g>
    
    <g>
      <!-- Subtitle -->
      <text x="350" y="258" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0f172a">(d) Jump Discontinuities: f(x) = ⟦x⟧</text>
      <!-- Axes -->
      <line x1="360" y1="390" x2="540" y2="390" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="440" y1="460" x2="440" y2="300" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="545" y="402" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">x</text>
      <text x="428" y="305" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">y</text>
      <text x="430" y="402" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">0</text>
      
      <!-- Steps -->
      
        <line x1="390" y1="440" x2="411.5" y2="440" stroke="#0284c7" stroke-width="2.2" />
        <circle cx="390" cy="440" r="3.2" fill="#0284c7" />
        <circle cx="415" cy="440" r="3.2" fill="#ffffff" stroke="#0284c7" stroke-width="1.6" />
        
        <line x1="415" y1="415" x2="436.5" y2="415" stroke="#0284c7" stroke-width="2.2" />
        <circle cx="415" cy="415" r="3.2" fill="#0284c7" />
        <circle cx="440" cy="415" r="3.2" fill="#ffffff" stroke="#0284c7" stroke-width="1.6" />
        
        <line x1="440" y1="390" x2="461.5" y2="390" stroke="#0284c7" stroke-width="2.2" />
        <circle cx="440" cy="390" r="3.2" fill="#0284c7" />
        <circle cx="465" cy="390" r="3.2" fill="#ffffff" stroke="#0284c7" stroke-width="1.6" />
        
        <line x1="465" y1="365" x2="486.5" y2="365" stroke="#0284c7" stroke-width="2.2" />
        <circle cx="465" cy="365" r="3.2" fill="#0284c7" />
        <circle cx="490" cy="365" r="3.2" fill="#ffffff" stroke="#0284c7" stroke-width="1.6" />
        
        <line x1="490" y1="340" x2="511.5" y2="340" stroke="#0284c7" stroke-width="2.2" />
        <circle cx="490" cy="340" r="3.2" fill="#0284c7" />
        <circle cx="515" cy="340" r="3.2" fill="#ffffff" stroke="#0284c7" stroke-width="1.6" />
        
    </g>
    
</svg>