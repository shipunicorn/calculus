    <text x="275" y="237" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-style="italic" fill="#16a34a">y = f(x) - c</text>

    <path d="M 240 180 C 256 135, 272 135, 288 160 C 302 182, 315 170, 325 176" fill="none" stroke="#0284c7" stroke-width="2" />
