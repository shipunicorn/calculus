<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" style="background-color: #ffffff; display: block; margin: 0 auto;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db2777" />
  </marker>
  <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
  </marker>
</defs>
<title>Discontinuities of a Graph</title>
<desc>Graph displaying removable, jump, and infinite discontinuities at x = 1, 3, and 5.</desc>
<rect width="480" height="260" fill="#ffffff" />


    <!-- Coordinate axes -->
    <line x1="30" y1="175" x2="414.6" y2="175" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="55" y1="225" x2="55" y2="25" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="420.4" y="189" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-style="italic">x</text>
    <text x="41" y="30" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-style="italic">y</text>
    <text x="43" y="189" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11">0</text>
    
        <line x1="113" y1="172" x2="113" y2="178" stroke="#1e293b" />
        <text x="109" y="191" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11">1</text>
        
        <line x1="171" y1="172" x2="171" y2="178" stroke="#1e293b" />
        <text x="167" y="191" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11">2</text>
        
        <line x1="229" y1="172" x2="229" y2="178" stroke="#1e293b" />
        <text x="225" y="191" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11">3</text>
        
        <line x1="287" y1="172" x2="287" y2="178" stroke="#1e293b" />
        <text x="283" y="191" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11">4</text>
        
        <line x1="345" y1="172" x2="345" y2="178" stroke="#1e293b" />
        <text x="341" y="191" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11">5</text>
        
    <!-- Piece 1: left of x = 1 -->
    <path d="M 37.6 134.4 C 66.6 122.8, 89.8 128.6, 113.0 148.9"
          fill="none" stroke="#0284c7" stroke-width="2.2" />
    <!-- Removable hole at x = 1 -->
    <circle cx="113.0" cy="148.9" r="3.6" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <!-- Piece 1: between x = 1 and x = 3 -->
    <path d="M 116.6 150.9 C 142.0 169.2, 176.8 198.2, 229.0 227.2"
          fill="none" stroke="#0284c7" stroke-width="2.2" />
    <!-- Open circle at x = 3, y = -0.9u -->
    <circle cx="229.0" cy="227.2" r="3.6" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    
    <!-- Piece 2: starts at solid dot at x = 3 -->
    <path d="M 229.0 128.6 C 258.0 134.4, 298.6 154.7, 345.0 154.7"
          fill="none" stroke="#0284c7" stroke-width="2.2" />
    <!-- Solid dot at x = 3 -->
    <circle cx="229.0" cy="128.6" r="3.5" fill="#0284c7" />

    <!-- Open circle at local min x = 5 -->
    <circle cx="345.0" cy="154.7" r="3.6" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />

    <!-- Curve right of x = 5 -->
    <path d="M 348.6 153.2 C 368.20000000000005 146.0, 385.6 122.8, 397.20000000000005 105.4"
          fill="none" stroke="#0284c7" stroke-width="2.2" />

    <!-- Isolated solid point at x = 5 -->
    <circle cx="345.0" cy="82.19999999999999" r="3.5" fill="#0284c7" />
    <text x="25" y="245" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e293b">FIGURE 2</text>
</svg>