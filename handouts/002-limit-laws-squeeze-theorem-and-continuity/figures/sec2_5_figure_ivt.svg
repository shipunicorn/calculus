<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" style="background-color: #ffffff; display: block; margin: 0 auto;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db2777" />
  </marker>
  <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
  </marker>
</defs>
<title>The Intermediate Value Theorem</title>
<desc>Continuous curve crossing horizontal line y = N at an intermediate point c.</desc>
<rect width="420" height="260" fill="#ffffff" />


    <!-- Coordinate axes -->
    <line x1="40" y1="195" x2="377.0" y2="195" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="65" y1="225" x2="65" y2="25" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="381.79999999999995" y="209" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-style="italic">x</text>
    <text x="51" y="30" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-style="italic">y</text>
    <text x="53" y="209" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11">0</text>
    
    <!-- Line y = N -->
    <line x1="65" y1="108.6" x2="353.0" y2="108.6" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="5 3" />
    <text x="47" y="112.6" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-style="italic" fill="#e11d48">N</text>
    <text x="329.0" y="100.6" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic" fill="#e11d48">y = N</text>

    <!-- Curve y = f(x) connecting (a, f(a)) and (b, f(b)) -->
    <path d="M 113.0 166.2 C 170.6 147.0, 175.4 123.0, 213.8 108.6 C 257.0 89.39999999999999, 266.6 79.8, 314.6 51.0"
          fill="none" stroke="#0284c7" stroke-width="2.4" />
    <text x="322.6" y="47.0" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-style="italic" fill="#0f172a">y = f(x)</text>

    <!-- Guidelines for a, b, c -->
    <line x1="113.0" y1="195" x2="113.0" y2="166.2" stroke="#64748b" stroke-dasharray="3 3" />
    <line x1="65" y1="166.2" x2="113.0" y2="166.2" stroke="#64748b" stroke-dasharray="3 3" />
    <text x="109.0" y="211" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-style="italic">a</text>
    <text x="41" y="170.2" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">f(a)</text>

    <line x1="314.6" y1="195" x2="314.6" y2="51.0" stroke="#64748b" stroke-dasharray="3 3" />
    <line x1="65" y1="51.0" x2="314.6" y2="51.0" stroke="#64748b" stroke-dasharray="3 3" />
    <text x="310.6" y="211" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-style="italic">b</text>
    <text x="41" y="55.0" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">f(b)</text>

    <!-- Value c on x axis -->
    <line x1="213.8" y1="195" x2="213.8" y2="108.6" stroke="#64748b" stroke-dasharray="3 3" />
    <text x="210.8" y="211" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-style="italic" fill="#0284c7">c</text>

    <!-- Endpoints and intersection -->
    <circle cx="113.0" cy="166.2" r="3.5" fill="#0284c7" />
    <circle cx="314.6" cy="51.0" r="3.5" fill="#0284c7" />
    <circle cx="213.8" cy="108.6" r="4.0" fill="#e11d48" />
    <text x="221.8" y="124.6" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" fill="#e11d48">(c, N)</text>
    <text x="25" y="245" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e293b">INTERMEDIATE VALUE THEOREM</text>
</svg>