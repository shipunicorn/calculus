<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 210" width="650" height="210" role="img" style="background-color: #ffffff; display: block; margin: 0 auto;">
<title>Four Cases of Rolle's Theorem</title>
<desc>Geometric demonstration of Rolle's Theorem across constant, peak, trough, and multi-extrema cases</desc>
<rect width="650" height="210" fill="#ffffff" />
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db2777" />
  </marker>
  <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
  </marker>
</defs>
<text x="85" y="25" font-family="Aptos, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold">(a) Constant</text>
<line x1="15" y1="150" x2="150" y2="150" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
<line x1="35" y1="175" x2="35" y2="35" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
<line x1="50" y1="150" x2="50" y2="105" stroke="#64748b" stroke-width="1.0" stroke-dasharray="3,3" />
<line x1="135" y1="150" x2="135" y2="105" stroke="#64748b" stroke-width="1.0" stroke-dasharray="3,3" />
<text x="46" y="165" font-family="Aptos, sans-serif" font-size="11">a</text>
<text x="131" y="165" font-family="Aptos, sans-serif" font-size="11">b</text>
<circle cx="50" cy="105" r="3.5" fill="#1e293b" />
<circle cx="135" cy="105" r="3.5" fill="#1e293b" />
<line x1="50" y1="105" x2="135" y2="105" stroke="#0284c7" stroke-width="2.0" />
<text x="240" y="25" font-family="Aptos, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold">(b) Interior Max</text>
<line x1="170" y1="150" x2="305" y2="150" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
<line x1="190" y1="175" x2="190" y2="35" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
<line x1="205" y1="150" x2="205" y2="105" stroke="#64748b" stroke-width="1.0" stroke-dasharray="3,3" />
<line x1="290" y1="150" x2="290" y2="105" stroke="#64748b" stroke-width="1.0" stroke-dasharray="3,3" />
<text x="201" y="165" font-family="Aptos, sans-serif" font-size="11">a</text>
<text x="286" y="165" font-family="Aptos, sans-serif" font-size="11">b</text>
<circle cx="205" cy="105" r="3.5" fill="#1e293b" />
<circle cx="290" cy="105" r="3.5" fill="#1e293b" />
<path d="M 205 105 Q 247.5 20 290 105" fill="none" stroke="#0284c7" stroke-width="2.0" />
<line x1="222.5" y1="60" x2="272.5" y2="60" stroke="#db2777" stroke-width="1.4" stroke-dasharray="3,3" />
<circle cx="247.5" cy="60" r="3.5" fill="#db2777" />
<text x="243.5" y="165" font-family="Aptos, sans-serif" font-size="11" fill="#db2777">c</text>
<text x="395" y="25" font-family="Aptos, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold">(c) Interior Min</text>
<line x1="325" y1="150" x2="460" y2="150" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
<line x1="345" y1="175" x2="345" y2="35" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
<line x1="360" y1="150" x2="360" y2="105" stroke="#64748b" stroke-width="1.0" stroke-dasharray="3,3" />
<line x1="445" y1="150" x2="445" y2="105" stroke="#64748b" stroke-width="1.0" stroke-dasharray="3,3" />
<text x="356" y="165" font-family="Aptos, sans-serif" font-size="11">a</text>
<text x="441" y="165" font-family="Aptos, sans-serif" font-size="11">b</text>
<circle cx="360" cy="105" r="3.5" fill="#1e293b" />
<circle cx="445" cy="105" r="3.5" fill="#1e293b" />
<path d="M 360 105 Q 402.5 175 445 105" fill="none" stroke="#0284c7" stroke-width="2.0" />
<line x1="377.5" y1="140" x2="427.5" y2="140" stroke="#db2777" stroke-width="1.4" stroke-dasharray="3,3" />
<circle cx="402.5" cy="140" r="3.5" fill="#db2777" />
<text x="398.5" y="165" font-family="Aptos, sans-serif" font-size="11" fill="#db2777">c</text>
<text x="550" y="25" font-family="Aptos, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold">(d) Multiple Extrema</text>
<line x1="480" y1="150" x2="615" y2="150" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
<line x1="500" y1="175" x2="500" y2="35" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)" />
<line x1="515" y1="150" x2="515" y2="105" stroke="#64748b" stroke-width="1.0" stroke-dasharray="3,3" />
<line x1="600" y1="150" x2="600" y2="105" stroke="#64748b" stroke-width="1.0" stroke-dasharray="3,3" />
<text x="511" y="165" font-family="Aptos, sans-serif" font-size="11">a</text>
<text x="596" y="165" font-family="Aptos, sans-serif" font-size="11">b</text>
<circle cx="515" cy="105" r="3.5" fill="#1e293b" />
<circle cx="600" cy="105" r="3.5" fill="#1e293b" />
<path d="M 515 105 C 540 45, 555 155, 575 65 S 600 105 600 105" fill="none" stroke="#0284c7" stroke-width="2.0" />
<circle cx="542" cy="77" r="3" fill="#db2777" />
<circle cx="573" cy="87" r="3" fill="#db2777" />
<text x="538" y="165" font-family="Aptos, sans-serif" font-size="10.5" fill="#db2777">c₁</text>
<text x="573" y="165" font-family="Aptos, sans-serif" font-size="10.5" fill="#db2777">c₂</text>
</svg>