<text x="67" y="158" font-family="Aptos, sans-serif" font-size="10.5" text-anchor="end" font-weight="bold">A</text>
<rect x="283" y="55" width="55" height="18" fill="#ffffff" />
<text x="285" y="68" font-family="Aptos, sans-serif" font-size="10.5" font-weight="bold">B</text>
<text x="121" y="226" font-family="Aptos, sans-serif" font-size="11" fill="#db2777">c₁</text>
<text x="201" y="226" font-family="Aptos, sans-serif" font-size="11" fill="#db2777">c₂</text>
</svg>