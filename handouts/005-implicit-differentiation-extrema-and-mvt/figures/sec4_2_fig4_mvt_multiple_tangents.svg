<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="340" height="260" role="img" style="background-color: #ffffff; display: block; margin: 0 auto;">
<title>Mean Value Theorem Multiple Tangents</title>
<desc>Mean Value Theorem with two parallel tangent points c1 and c2</desc>
<rect width="340" height="260" fill="#ffffff" />
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db2777" />
  </marker>
  <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
  </marker>
</defs>
<line x1="20" y1="210" x2="310" y2="210" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)" />
<line x1="50" y1="240" x2="50" y2="30" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)" />
<text x="315" y="224" font-family="Aptos, sans-serif" font-size="12" font-style="italic">x</text>
<text x="34" y="25" font-family="Aptos, sans-serif" font-size="12" font-style="italic">y</text>
<text x="36" y="226" font-family="Aptos, sans-serif" font-size="11">0</text>
<line x1="75" y1="165" x2="275" y2="65" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
<line x1="80.0" y1="102.5" x2="170.0" y2="57.5" stroke="#db2777" stroke-width="1.6" />
<line x1="160.0" y1="147.5" x2="250.0" y2="250.0" stroke="#db2777" stroke-width="1.6" />
<path d="M 75 165 C 115 55, 170 180, 275 65" fill="none" stroke="#0284c7" stroke-width="2.2" />
<circle cx="75" cy="165" r="4" fill="#1e293b" />
<circle cx="275" cy="65" r="4" fill="#1e293b" />
<circle cx="125" cy="80" r="4" fill="#db2777" />
<circle cx="205" cy="125" r="4" fill="#db2777" />
