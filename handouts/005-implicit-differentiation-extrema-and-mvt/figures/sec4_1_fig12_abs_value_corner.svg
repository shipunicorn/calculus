<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="340" height="260" role="img" style="background-color: #ffffff; display: block; margin: 0 auto;">
<title>Absolute Value Corner</title>
<desc>Graph of y = |x| with minimum at non-differentiable corner</desc>
<rect width="340" height="260" fill="#ffffff" />
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db2777" />
  </marker>
  <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
  </marker>
</defs>
<line x1="30" y1="180" x2="310" y2="180" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)" />
<line x1="170" y1="230" x2="170" y2="30" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)" />
<text x="315" y="194" font-family="Aptos, sans-serif" font-size="12" font-style="italic">x</text>
<text x="154" y="25" font-family="Aptos, sans-serif" font-size="12" font-style="italic">y</text>
<text x="156" y="196" font-family="Aptos, sans-serif" font-size="11">0</text>
<line x1="170" y1="180" x2="49.0" y2="59.0" stroke="#0284c7" stroke-width="2.2" />
<line x1="170" y1="180" x2="291.0" y2="59.0" stroke="#0284c7" stroke-width="2.2" />
<circle cx="170" cy="180" r="4.5" fill="#db2777" />
<rect x="266.0" y="38.999999999999986" width="55" height="18" fill="#ffffff" />
<text x="269.0" y="51.999999999999986" font-family="Aptos, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">y = |x|</text>
<rect x="80" y="202" width="180" height="18" fill="#ffffff" />
<text x="170" y="215" font-family="Aptos, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#db2777">Min at (0, 0), f'(0) undefined</text>
</svg>