<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" role="img" aria-labelledby="fig4-title fig4-desc" style="background-color: #ffffff; display: block; margin: 0 auto;">
  <title id="fig4-title">Three Limit Cases</title>
  <desc id="fig4-desc">Compares three cases where limit as x approaches a is L: continuous, displaced point, and undefined hole</desc>
  <rect width="100%" height="100%" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Case A -->
  <rect x="15" y="15" width="175" height="170" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6" />
  <text x="102" y="36" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Case A: f(a) = L</text>
  <line x1="25" y1="130" x2="180" y2="130" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="45" y1="165" x2="45" y2="45" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 45 125 C 75 105, 102 90, 102 90 C 120 78, 145 65, 170 58" fill="none" stroke="#0284c7" stroke-width="2.2" />
  <line x1="102" y1="90" x2="102" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2" />
  <line x1="102" y1="90" x2="45" y2="90" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2" />
  <circle cx="102" cy="90" r="4" fill="#0284c7" />
  <text x="102" y="145" font-family="'Cascadia Mono', monospace" font-size="11" fill="#334155" text-anchor="middle">a</text>
  <text x="38" y="93" font-family="'Cascadia Mono', monospace" font-size="11" fill="#334155" text-anchor="end">L</text>
  <text x="102" y="172" font-family="Aptos, sans-serif" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">Continuous</text>

  <!-- Case B -->
  <rect x="202" y="15" width="175" height="170" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6" />
  <text x="290" y="36" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Case B: f(a) ≠ L</text>
  <line x1="212" y1="130" x2="367" y2="130" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="232" y1="165" x2="232" y2="45" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 232 125 C 262 105, 290 90, 290 90 C 308 78, 333 65, 358 58" fill="none" stroke="#0284c7" stroke-width="2.2" />
  <line x1="290" y1="90" x2="290" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2" />
  <line x1="290" y1="90" x2="232" y2="90" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2" />
  <circle cx="290" cy="90" r="4" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
  <circle cx="290" cy="60" r="4" fill="#d92672" />
  <text x="290" y="145" font-family="'Cascadia Mono', monospace" font-size="11" fill="#334155" text-anchor="middle">a</text>
  <text x="225" y="93" font-family="'Cascadia Mono', monospace" font-size="11" fill="#334155" text-anchor="end">L</text>
  <text x="290" y="172" font-family="Aptos, sans-serif" font-size="11" font-weight="bold" fill="#be185d" text-anchor="middle">Displaced Point</text>

  <!-- Case C -->
  <rect x="390" y="15" width="175" height="170" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6" />
  <text x="477" y="36" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Case C: f(a) Undefined</text>
  <line x1="400" y1="130" x2="555" y2="130" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="420" y1="165" x2="420" y2="45" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 420 125 C 450 105, 477 90, 477 90 C 495 78, 520 65, 545 58" fill="none" stroke="#0284c7" stroke-width="2.2" />
  <line x1="477" y1="90" x2="477" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2" />
  <line x1="477" y1="90" x2="420" y2="90" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2" />
  <circle cx="477" cy="90" r="4" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
  <text x="477" y="145" font-family="'Cascadia Mono', monospace" font-size="11" fill="#334155" text-anchor="middle">a</text>
  <text x="413" y="93" font-family="'Cascadia Mono', monospace" font-size="11" fill="#334155" text-anchor="end">L</text>
  <text x="477" y="172" font-family="Aptos, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">Hole in Graph</text>

</svg>