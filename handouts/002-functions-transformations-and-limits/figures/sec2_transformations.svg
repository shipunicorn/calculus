<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="580" height="220" role="img" aria-labelledby="fig3-title fig3-desc" style="background-color: #ffffff; display: block; margin: 0 auto;">
  <title id="fig3-title">Graph Transformations</title>
  <desc id="fig3-desc">Illustrates shifts up and right, vertical stretch, and reflection across x axis</desc>
  <rect width="100%" height="100%" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Panel 1: Translations -->
  <rect x="15" y="15" width="265" height="190" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6" />
  <text x="147" y="38" font-family="Aptos, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Vertical and Horizontal Shifts</text>

  <!-- Axes Panel 1 -->
  <line x1="30" y1="125" x2="265" y2="125" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="147" y1="185" x2="147" y2="50" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="268" y="129" font-family="Aptos, sans-serif" font-size="12" font-style="italic" fill="#64748b">x</text>
  <text x="144" y="47" font-family="Aptos, sans-serif" font-size="12" font-style="italic" fill="#64748b">y</text>

  <!-- Base parabola y = x^2 -->
  <path d="M 117 80 Q 147 135, 177 80" fill="none" stroke="#0284c7" stroke-width="2" />
  <text x="178" y="78" font-family="Aptos, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">y = f(x)</text>

  <!-- Shifted Right: y = f(x - c) -->
  <path d="M 152 80 Q 182 135, 212 80" fill="none" stroke="#d92672" stroke-width="1.8" stroke-dasharray="4 2" />
  <text x="200" y="98" font-family="Aptos, sans-serif" font-size="11" fill="#be185d">f(x - c)</text>

  <!-- Shifted Up: y = f(x) + c -->
  <path d="M 117 55 Q 147 110, 177 55" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="4 2" />
  <text x="110" y="62" font-family="Aptos, sans-serif" font-size="11" fill="#15803d">f(x) + c</text>

  <!-- Panel 2: Stretching & Reflecting -->
  <rect x="295" y="15" width="270" height="190" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6" />
  <text x="430" y="38" font-family="Aptos, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Stretching &amp; Reflecting</text>

  <!-- Axes Panel 2 -->
  <line x1="310" y1="125" x2="545" y2="125" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="430" y1="185" x2="430" y2="50" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="548" y="129" font-family="Aptos, sans-serif" font-size="12" font-style="italic" fill="#64748b">x</text>
  <text x="427" y="47" font-family="Aptos, sans-serif" font-size="12" font-style="italic" fill="#64748b">y</text>

  <!-- Base curve y = f(x) -->
  <path d="M 400 85 Q 430 135, 460 85" fill="none" stroke="#0284c7" stroke-width="2" />
  <text x="462" y="85" font-family="Aptos, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">f(x)</text>

  <!-- Reflected across x-axis: y = -f(x) -->
  <path d="M 400 165 Q 430 115, 460 165" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="4 2" />
  <text x="462" y="168" font-family="Aptos, sans-serif" font-size="11" fill="#c2410c">-f(x)</text>

  <!-- Vertically stretched: y = c f(x) -->
  <path d="M 412 55 Q 430 135, 448 55" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4 2" />
  <text x="444" y="58" font-family="Aptos, sans-serif" font-size="11" fill="#6d28d9">c f(x)</text>

</svg>