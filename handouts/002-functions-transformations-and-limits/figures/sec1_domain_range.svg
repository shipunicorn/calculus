<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="540" height="260" role="img" aria-labelledby="fig1-title fig1-desc" style="background-color: #ffffff; display: block; margin: 0 auto;">
  <title id="fig1-title">Domain and Range Projections</title>
  <desc id="fig1-desc">Shows domain as projection onto horizontal axis and range as projection onto vertical axis</desc>
  <rect x="0" y="0" width="540" height="260" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Coordinate Axes -->
  <line x1="70" y1="205" x2="500" y2="205" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="110" y1="230" x2="110" y2="30" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="505" y="209" font-family="Aptos, sans-serif" font-size="14" font-style="italic" fill="#1e293b">x</text>
  <text x="94" y="24" font-family="Aptos, sans-serif" font-size="14" font-style="italic" fill="#1e293b">y</text>
  <text x="94" y="223" font-family="'Cascadia Mono', monospace" font-size="12" fill="#64748b">0</text>

  <!-- Curve y = f(x): starts (ox+50, 150), peaks (ox+190, 65), ends (ox+330, 115) -->
  <path d="M 160 150 C 220 65, 270 65, 300 65 C 350 65, 400 85, 440 115" fill="none" stroke="#0284c7" stroke-width="2.5" />
  <circle cx="160" cy="150" r="4" fill="#0284c7" />
  <circle cx="440" cy="115" r="4" fill="#0284c7" />
  <text x="315" y="60" font-family="Aptos, sans-serif" font-size="14" font-style="italic" font-weight="bold" fill="#0369a1">y = f(x)</text>

  <!-- Domain Projections onto x-axis -->
  <line x1="160" y1="150" x2="160" y2="205" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" />
  <line x1="440" y1="115" x2="440" y2="205" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" />
  <line x1="160" y1="205" x2="440" y2="205" stroke="#d92672" stroke-width="3.5" />
  <circle cx="160" cy="205" r="4" fill="#d92672" />
  <circle cx="440" cy="205" r="4" fill="#d92672" />
  
  <text x="160" y="227" font-family="'Cascadia Mono', monospace" font-size="13" fill="#0f172a" text-anchor="middle">a</text>
  <text x="440" y="227" font-family="'Cascadia Mono', monospace" font-size="13" fill="#0f172a" text-anchor="middle">b</text>
  <text x="300" y="230" font-family="Aptos, sans-serif" font-size="13" font-weight="bold" fill="#be185d" text-anchor="middle">Domain: [a, b]</text>

  <!-- Range Projections onto y-axis -->
  <line x1="160" y1="150" x2="110" y2="150" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" />
  <line x1="300" y1="65" x2="110" y2="65" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" />
  <line x1="110" y1="65" x2="110" y2="150" stroke="#16a34a" stroke-width="3.5" />
  <circle cx="110" cy="65" r="4" fill="#16a34a" />
  <circle cx="110" cy="150" r="4" fill="#16a34a" />
  
  <text x="96" y="69" font-family="'Cascadia Mono', monospace" font-size="13" fill="#0f172a" text-anchor="end">M</text>
  <text x="96" y="154" font-family="'Cascadia Mono', monospace" font-size="13" fill="#0f172a" text-anchor="end">m</text>
  <text x="96" y="112" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="end">Range: [m, M]</text>

</svg>