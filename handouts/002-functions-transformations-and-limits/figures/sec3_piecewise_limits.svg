<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280" role="img" aria-labelledby="fig5-title fig5-desc" style="background-color: #ffffff; display: block; margin: 0 auto;">
  <title id="fig5-title">Piecewise Function and One-Sided Limits</title>
  <desc id="fig5-desc">Illustrates jump discontinuity at x=2 where limit DNE and removable discontinuity at x=5 where limit is 2</desc>
  <rect x="0" y="0" width="540" height="280" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Grid lines -->
  <line x1="70" y1="170" x2="482.5" y2="170" stroke="#f1f5f9" stroke-width="1" />
  <line x1="70" y1="140" x2="482.5" y2="140" stroke="#f1f5f9" stroke-width="1" />
  <line x1="70" y1="110" x2="482.5" y2="110" stroke="#f1f5f9" stroke-width="1" />
  <line x1="70" y1="80" x2="482.5" y2="80" stroke="#f1f5f9" stroke-width="1" />

  <!-- Axes -->
  <line x1="50" y1="200" x2="510" y2="200" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="70" y1="225" x2="70" y2="35.0" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="515" y="204" font-family="Aptos, sans-serif" font-size="14" font-style="italic" fill="#1e293b">x</text>
  <text x="56" y="41.0" font-family="Aptos, sans-serif" font-size="14" font-style="italic" fill="#1e293b">y</text>
  <text x="56" y="216" font-family="'Cascadia Mono', monospace" font-size="12" fill="#64748b">0</text>

  <!-- Number labels -->
  <text x="180" y="218" font-family="'Cascadia Mono', monospace" font-size="12" fill="#64748b" text-anchor="middle">2</text>
  <text x="345" y="218" font-family="'Cascadia Mono', monospace" font-size="12" fill="#64748b" text-anchor="middle">5</text>
  
  <text x="58" y="174" font-family="'Cascadia Mono', monospace" font-size="12" fill="#64748b" text-anchor="end">1</text>
  <text x="58" y="144" font-family="'Cascadia Mono', monospace" font-size="12" fill="#64748b" text-anchor="end">2</text>
  <text x="58" y="114" font-family="'Cascadia Mono', monospace" font-size="12" fill="#64748b" text-anchor="end">3</text>

  <!-- Piece 1: x in [0, 2): y = 1 + x -> starts (0, 1), approaches (2, 3) open circle -->
  <line x1="70" y1="170" x2="180" y2="110" stroke="#0284c7" stroke-width="2.5" />
  <circle cx="70" cy="170" r="4" fill="#0284c7" />
  <circle cx="180" cy="110" r="4" fill="#ffffff" stroke="#0284c7" stroke-width="2.2" />

  <!-- Piece 2: x in [2, 5): line from (2, 1) [solid] to (5, 2) [open] -->
  <line x1="180" y1="170" x2="345" y2="140" stroke="#0284c7" stroke-width="2.5" />
  <circle cx="180" cy="170" r="4" fill="#0284c7" />
  <circle cx="345" cy="140" r="4" fill="#ffffff" stroke="#0284c7" stroke-width="2.2" />

  <!-- Piece 3: x in (5, 7.5]: curve from (5, 2) [open] curving down -->
  <path d="M 345 140 Q 400 140, 482.5 185.0" fill="none" stroke="#0284c7" stroke-width="2.5" />
  <circle cx="482.5" cy="185.0" r="4" fill="#0284c7" />

  <!-- Isolated point at x = 5: g(5) = 1.25 -->
  <circle cx="345" cy="164.0" r="4" fill="#d92672" />

  <!-- Annotations at x = 2 -->
  <line x1="180" y1="200" x2="180" y2="110" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2" />
  <rect x="105" y="15" width="150" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4" />
  <text x="180" y="31" font-family="Aptos, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">x = 2: Jump Discontinuity</text>
  <text x="180" y="46" font-family="Aptos, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Left: 3 ≠ Right: 1 (DNE)</text>

  <!-- Annotations at x = 5 -->
  <line x1="345" y1="200" x2="345" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2" />
  <rect x="280" y="15" width="130" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4" />
  <text x="345" y="31" font-family="Aptos, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">x = 5: Removable Hole</text>
  <text x="345" y="46" font-family="Aptos, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Limit = 2, g(5) ≈ 1.2</text>

</svg>