<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260" style="background-color: #ffffff; display: block; margin: 0 auto;" role="img" aria-labelledby="sec3-9-ex47-step-derivative-title sec3-9-ex47-step-derivative-desc">
  <title id="sec3-9-ex47-step-derivative-title">Step Derivative and Antiderivative</title>
  <desc id="sec3-9-ex47-step-derivative-desc">Continuous antiderivative of a step derivative graph</desc>
  <rect x="0" y="0" width="620.0" height="260.0" fill="#ffffff" />

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db2777" />
  </marker>
  <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" />
  </marker>
</defs>

    <!-- Left: Step derivative f'(x) -->
    <rect x="15" y="15" width="280" height="230" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="155" y="35" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Given Derivative y = f'(x)</text>

    <!-- Axes Left -->
    <line x1="40" y1="170" x2="270" y2="170" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)" />
    <line x1="55" y1="215" x2="55" y2="50" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)" />
    <text x="275" y="184" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">x</text>
    <text x="43" y="55" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">y</text>
    <text x="45" y="184" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">0</text>

    <!-- Ticks Left -->
    <line x1="115" y1="167" x2="115" y2="173" stroke="#1e293b" stroke-width="1" />
    <text x="112" y="184" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">1</text>
    <line x1="175" y1="167" x2="175" y2="173" stroke="#1e293b" stroke-width="1" />
    <text x="172" y="184" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">2</text>
    <line x1="235" y1="167" x2="235" y2="173" stroke="#1e293b" stroke-width="1" />
    <text x="232" y="184" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">3</text>

    <line x1="52" y1="125" x2="58" y2="125" stroke="#1e293b" stroke-width="1" />
    <text x="40" y="129" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">1</text>
    <line x1="52" y1="80" x2="58" y2="80" stroke="#1e293b" stroke-width="1" />
    <text x="40" y="84" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">2</text>
    <line x1="52" y1="215" x2="58" y2="215" stroke="#1e293b" stroke-width="1" />
    <text x="37" y="219" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">−1</text>

    <!-- Segments of f'(x) -->
    <!-- Segment 1: y = 2 for [0, 1) -->
    <line x1="55" y1="80" x2="115" y2="80" stroke="#db2777" stroke-width="2.5" />
    <circle cx="55" cy="80" r="3.2" fill="#db2777" />
    <circle cx="115" cy="80" r="3.2" fill="#ffffff" stroke="#db2777" stroke-width="1.8" />

    <!-- Segment 2: y = 1 for (1, 2) -->
    <line x1="115" y1="125" x2="175" y2="125" stroke="#db2777" stroke-width="2.5" />
    <circle cx="115" cy="125" r="3.2" fill="#ffffff" stroke="#db2777" stroke-width="1.8" />
    <circle cx="175" cy="125" r="3.2" fill="#ffffff" stroke="#db2777" stroke-width="1.8" />

    <!-- Segment 3: y = -1 for (2, 3] -->
    <line x1="175" y1="215" x2="235" y2="215" stroke="#db2777" stroke-width="2.5" />
    <circle cx="175" cy="215" r="3.2" fill="#ffffff" stroke="#db2777" stroke-width="1.8" />
    <circle cx="235" cy="215" r="3.2" fill="#db2777" />

    <text x="163.0" y="98.0" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" fill="#db2777">y = f'(x)</text>

    <!-- Right: Continuous Antiderivative f(x) with f(0) = -1 -->
    <rect x="315" y="15" width="290" height="230" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="460" y="35" font-family="Aptos, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Continuous Antiderivative f(x)</text>

    <!-- Axes Right -->
    <line x1="340" y1="170" x2="580" y2="170" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)" />
    <line x1="355" y1="215" x2="355" y2="50" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)" />
    <text x="585" y="184" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">x</text>
    <text x="343" y="55" font-family="Aptos, 'Segoe UI', sans-serif" font-size="11" font-style="italic">y</text>
    <text x="345" y="184" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">0</text>

    <!-- Ticks Right -->
    <line x1="415" y1="167" x2="415" y2="173" stroke="#1e293b" stroke-width="1" />
    <text x="412" y="184" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">1</text>
    <line x1="475" y1="167" x2="475" y2="173" stroke="#1e293b" stroke-width="1" />
    <text x="472" y="184" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">2</text>
    <line x1="535" y1="167" x2="535" y2="173" stroke="#1e293b" stroke-width="1" />
    <text x="532" y="184" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">3</text>

    <line x1="352" y1="125" x2="358" y2="125" stroke="#1e293b" stroke-width="1" />
    <text x="340" y="129" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">1</text>
    <line x1="352" y1="80" x2="358" y2="80" stroke="#1e293b" stroke-width="1" />
    <text x="340" y="84" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">2</text>
    <line x1="352" y1="215" x2="358" y2="215" stroke="#1e293b" stroke-width="1" />
    <text x="337" y="219" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10">−1</text>

    <!-- Continuous path: (0, -1) -> (1, 1) -> (2, 2) -> (3, 1) -->
    <polyline points="355,215 415,125 475,80 535,125" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linejoin="round" />
    
    <circle cx="355" cy="215" r="3.5" fill="#0284c7" />
    <text x="361" y="227" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#0369a1">(0, −1)</text>

    <circle cx="415" cy="125" r="3.5" fill="#0284c7" />
    <text x="420" y="121" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#0369a1">(1, 1)</text>

    <circle cx="475" cy="80" r="3.5" fill="#0284c7" />
    <text x="475" y="72" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#0369a1" text-anchor="middle">(2, 2)</text>

    <circle cx="535" cy="125" r="3.5" fill="#0284c7" />
    <text x="541" y="129" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#0369a1">(3, 1)</text>

    <!-- Slopes on segments -->
    <text x="382.0" y="165.5" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#0284c7">m = 2</text>
    <text x="439.0" y="93.5" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#0284c7">m = 1</text>
    <text x="508.0" y="93.5" font-family="Aptos, 'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#0284c7">m = −1</text>
    
</svg>