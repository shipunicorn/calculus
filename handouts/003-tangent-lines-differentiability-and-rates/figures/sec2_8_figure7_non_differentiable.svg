<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="580" height="270" role="img" aria-labelledby="fail-title fail-desc" style="background-color: #ffffff; display: block; margin: 0 auto;">
  <title id="fail-title">Three Ways for a Function to Fail to Be Differentiable</title>
  <desc id="fail-desc">Diagram showing three differentiability failure modes: a sharp corner, a discontinuity, and a vertical tangent line</desc>
  <rect x="0" y="0" width="580" height="270" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Panel A: Corner (center x=95, axes at ox=40, oy=175) -->
  <line x1="20" y1="175" x2="170" y2="175" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="45" y1="200" x2="45" y2="50" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="175" y="179" font-family="Aptos, sans-serif" font-size="13" font-style="italic" fill="#1e293b">x</text>
  <text x="32" y="45" font-family="Aptos, sans-serif" font-size="13" font-style="italic" fill="#1e293b">y</text>
  <text x="34" y="188" font-family="'Cascadia Mono', monospace" font-size="11" fill="#64748b">0</text>

  <line x1="105" y1="172" x2="105" y2="178" stroke="#1e293b" stroke-width="1.2" />
  <text x="102" y="193" font-family="'Cascadia Mono', monospace" font-size="11" font-style="italic" fill="#1e293b">a</text>

  <path d="M 50 145 Q 75 140, 105 100" fill="none" stroke="#0284c7" stroke-width="2.4" />
  <path d="M 105 100 Q 130 140, 155 140" fill="none" stroke="#0284c7" stroke-width="2.4" />
  <circle cx="105" cy="100" r="3.5" fill="#0284c7" />

  <text x="95" y="225" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">(a) A corner</text>

  <!-- Panel B: Discontinuity (ox=230, oy=175) -->
  <line x1="210" y1="175" x2="360" y2="175" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="235" y1="200" x2="235" y2="50" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="365" y="179" font-family="Aptos, sans-serif" font-size="13" font-style="italic" fill="#1e293b">x</text>
  <text x="222" y="45" font-family="Aptos, sans-serif" font-size="13" font-style="italic" fill="#1e293b">y</text>
  <text x="224" y="188" font-family="'Cascadia Mono', monospace" font-size="11" fill="#64748b">0</text>

  <line x1="295" y1="172" x2="295" y2="178" stroke="#1e293b" stroke-width="1.2" />
  <text x="292" y="193" font-family="'Cascadia Mono', monospace" font-size="11" font-style="italic" fill="#1e293b">a</text>

  <path d="M 240 160 Q 265 120, 290 110" fill="none" stroke="#0284c7" stroke-width="2.4" />
  <path d="M 295 150 Q 320 155, 345 130" fill="none" stroke="#0284c7" stroke-width="2.4" />
  <circle cx="295" cy="110" r="4" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
  <circle cx="295" cy="150" r="4" fill="#0284c7" />

  <text x="285" y="225" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">(b) A discontinuity</text>

  <!-- Panel C: Vertical Tangent (ox=420, oy=175) -->
  <line x1="400" y1="175" x2="550" y2="175" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="425" y1="200" x2="425" y2="50" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="555" y="179" font-family="Aptos, sans-serif" font-size="13" font-style="italic" fill="#1e293b">x</text>
  <text x="412" y="45" font-family="Aptos, sans-serif" font-size="13" font-style="italic" fill="#1e293b">y</text>
  <text x="414" y="188" font-family="'Cascadia Mono', monospace" font-size="11" fill="#64748b">0</text>

  <line x1="485" y1="172" x2="485" y2="178" stroke="#1e293b" stroke-width="1.2" />
  <text x="482" y="193" font-family="'Cascadia Mono', monospace" font-size="11" font-style="italic" fill="#1e293b">a</text>

  <!-- Vertical tangent line in magenta -->
  <line x1="485" y1="65" x2="485" y2="175" stroke="#db2777" stroke-width="2" stroke-dasharray="4 3" />

  <!-- S-curve through (485, 120) with vertical tangent -->
  <path d="M 435 155 C 455 110, 480 115, 485 120" fill="none" stroke="#0284c7" stroke-width="2.4" />
  <path d="M 485 120 C 490 125, 515 130, 535 85" fill="none" stroke="#0284c7" stroke-width="2.4" />
  <circle cx="485" cy="120" r="3.5" fill="#0284c7" />

  <text x="475" y="225" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">(c) Vertical tangent</text>

  <text x="290" y="255" font-family="Aptos, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Figure 7: Three Ways for a Function to Fail to Be Differentiable</text>
</svg>