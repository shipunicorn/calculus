<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="540" height="330" role="img" aria-labelledby="hyp-title hyp-desc" style="background-color: #ffffff; display: block; margin: 0 auto;">
  <title id="hyp-title">Tangent Line to the Hyperbola y = 3/x at (3, 1)</title>
  <desc id="hyp-desc">Graph of the reciprocal curve y = 3/x showing the tangent line x + 3y - 6 = 0 with slope -1/3 at (3, 1)</desc>
  <rect x="0" y="0" width="540" height="330" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Axes (ox=70, oy=250, ux=65, uy=65) -->
  <line x1="45" y1="250" x2="495" y2="250" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="70" y1="285" x2="70" y2="35" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="500" y="254" font-family="Aptos, sans-serif" font-size="14" font-style="italic" fill="#1e293b">x</text>
  <text x="52" y="30" font-family="Aptos, sans-serif" font-size="14" font-style="italic" fill="#1e293b">y</text>
  <text x="54" y="266" font-family="'Cascadia Mono', monospace" font-size="12" fill="#64748b">0</text>

  <!-- Ticks x = 1 to 6 (70 + k*65) -->
  <line x1="135" y1="247" x2="135" y2="253" stroke="#1e293b" stroke-width="1.2" />
  <text x="131" y="268" font-family="'Cascadia Mono', monospace" font-size="12" fill="#1e293b">1</text>
  <line x1="200" y1="247" x2="200" y2="253" stroke="#1e293b" stroke-width="1.2" />
  <text x="196" y="268" font-family="'Cascadia Mono', monospace" font-size="12" fill="#1e293b">2</text>
  <line x1="265" y1="247" x2="265" y2="253" stroke="#1e293b" stroke-width="1.2" />
  <text x="261" y="268" font-family="'Cascadia Mono', monospace" font-size="12" fill="#1e293b">3</text>
  <line x1="330" y1="247" x2="330" y2="253" stroke="#1e293b" stroke-width="1.2" />
  <text x="326" y="268" font-family="'Cascadia Mono', monospace" font-size="12" fill="#1e293b">4</text>
  <line x1="395" y1="247" x2="395" y2="253" stroke="#1e293b" stroke-width="1.2" />
  <text x="391" y="268" font-family="'Cascadia Mono', monospace" font-size="12" fill="#1e293b">5</text>
  <line x1="460" y1="247" x2="460" y2="253" stroke="#1e293b" stroke-width="1.2" />
  <text x="456" y="268" font-family="'Cascadia Mono', monospace" font-size="12" fill="#1e293b">6</text>

  <!-- Ticks y = 1 to 3 (250 - k*65) -->
  <line x1="67" y1="185" x2="73" y2="185" stroke="#1e293b" stroke-width="1.2" />
  <text x="52" y="189" font-family="'Cascadia Mono', monospace" font-size="12" fill="#1e293b">1</text>
  <line x1="67" y1="120" x2="73" y2="120" stroke="#1e293b" stroke-width="1.2" />
  <text x="52" y="124" font-family="'Cascadia Mono', monospace" font-size="12" fill="#1e293b">2</text>
  <line x1="67" y1="55" x2="73" y2="55" stroke="#1e293b" stroke-width="1.2" />
  <text x="52" y="59" font-family="'Cascadia Mono', monospace" font-size="12" fill="#1e293b">3</text>

  <!-- Curve y = 3/x from x = 0.8 to x = 6.2 -->
  <path d="M 122 40 C 135 120, 180 185, 265 185 C 330 185, 410 215, 473 218" fill="none" stroke="#0284c7" stroke-width="2.5" />

  <!-- Tangent line at (3, 1): x + 3y - 6 = 0 => y = -1/3 x + 2 -->
  <!-- at x = 0.6, px=109, y=1.8, py=250-1.8*65=133 -->
  <!-- at x = 5.6, px=434, y=0.133, py=250-0.133*65=241 -->
  <line x1="90" y1="128" x2="460" y2="251" stroke="#db2777" stroke-width="2.2" />

  <!-- Dashed projection guidelines for (3, 1) -> (265, 185) -->
  <line x1="265" y1="250" x2="265" y2="185" stroke="#0d9488" stroke-width="1.2" stroke-dasharray="4 3" />
  <line x1="70" y1="185" x2="265" y2="185" stroke="#0d9488" stroke-width="1.2" stroke-dasharray="4 3" />
  <circle cx="265" cy="185" r="4.5" fill="#1e293b" />

  <!-- Labels with white rects -->
  <rect x="275" y="172" width="60" height="20" fill="#ffffff" />
  <text x="278" y="187" font-family="'Cascadia Mono', monospace" font-size="12" font-weight="bold" fill="#1e293b">(3, 1)</text>

  <rect x="360" y="200" width="65" height="20" fill="#ffffff" />
  <text x="362" y="215" font-family="Aptos, sans-serif" font-size="13" font-style="italic" font-weight="bold" fill="#0284c7">y = 3/x</text>

  <rect x="250" y="90" width="220" height="42" fill="#ffffff" stroke="#db2777" stroke-width="1" rx="4" />
  <text x="258" y="108" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#db2777">Tangent line at (3, 1):</text>
  <text x="258" y="124" font-family="'Cascadia Mono', monospace" font-size="12" fill="#db2777">x + 3y - 6 = 0  (m = -1/3)</text>

  <text x="270" y="315" font-family="Aptos, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Figure 4: Tangent Line to the Hyperbola y = 3/x at (3, 1)</text>
</svg>