<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280" role="img" aria-labelledby="runners-title runners-desc" style="background-color: #ffffff; display: block; margin: 0 auto;">
  <title id="runners-title">Position Graphs of Runners A and B</title>
  <desc id="runners-desc">Position s in meters versus time t in seconds for runners A and B during a 100 meter race tying at 14 seconds</desc>
  <rect x="0" y="0" width="540" height="280" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Grid lines (ox=70, oy=220, w=350, h=160, 14s=350px => 25px/s, 100m=160px => 1.6px/m) -->
  <line x1="70" y1="220" x2="420" y2="220" stroke="#e2e8f0" stroke-width="1" />
  <line x1="70" y1="188" x2="420" y2="188" stroke="#e2e8f0" stroke-width="1" />
  <line x1="70" y1="156" x2="420" y2="156" stroke="#e2e8f0" stroke-width="1" />
  <line x1="70" y1="124" x2="420" y2="124" stroke="#e2e8f0" stroke-width="1" />
  <line x1="70" y1="92" x2="420" y2="92" stroke="#e2e8f0" stroke-width="1" />
  <line x1="70" y1="60" x2="420" y2="60" stroke="#e2e8f0" stroke-width="1" />

  <line x1="70" y1="220" x2="70" y2="60" stroke="#e2e8f0" stroke-width="1" />
  <line x1="120" y1="220" x2="120" y2="60" stroke="#e2e8f0" stroke-width="1" />
  <line x1="170" y1="220" x2="170" y2="60" stroke="#e2e8f0" stroke-width="1" />
  <line x1="220" y1="220" x2="220" y2="60" stroke="#e2e8f0" stroke-width="1" />
  <line x1="270" y1="220" x2="270" y2="60" stroke="#e2e8f0" stroke-width="1" />
  <line x1="320" y1="220" x2="320" y2="60" stroke="#e2e8f0" stroke-width="1" />
  <line x1="370" y1="220" x2="370" y2="60" stroke="#e2e8f0" stroke-width="1" />
  <line x1="420" y1="220" x2="420" y2="60" stroke="#e2e8f0" stroke-width="1" />

  <!-- Axes -->
  <line x1="60" y1="220" x2="455" y2="220" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="70" y1="230" x2="70" y2="40" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  
  <text x="460" y="224" font-family="Aptos, sans-serif" font-size="13" font-style="italic" fill="#1e293b">t (s)</text>
  <text x="50" y="32" font-family="Aptos, sans-serif" font-size="13" font-style="italic" fill="#1e293b">s (m)</text>
  <text x="56" y="235" font-family="'Cascadia Mono', monospace" font-size="12" fill="#64748b">0</text>

  <!-- Horizontal Axis Ticks -->
  <text x="116" y="238" font-family="'Cascadia Mono', monospace" font-size="11" fill="#1e293b">2</text>
  <text x="166" y="238" font-family="'Cascadia Mono', monospace" font-size="11" fill="#1e293b">4</text>
  <text x="216" y="238" font-family="'Cascadia Mono', monospace" font-size="11" fill="#1e293b">6</text>
  <text x="266" y="238" font-family="'Cascadia Mono', monospace" font-size="11" fill="#1e293b">8</text>
  <text x="313" y="238" font-family="'Cascadia Mono', monospace" font-size="11" fill="#1e293b">10</text>
  <text x="363" y="238" font-family="'Cascadia Mono', monospace" font-size="11" fill="#1e293b">12</text>
  <text x="413" y="238" font-family="'Cascadia Mono', monospace" font-size="11" fill="#1e293b">14</text>

  <!-- Vertical Axis Ticks -->
  <text x="42" y="192" font-family="'Cascadia Mono', monospace" font-size="11" fill="#1e293b">20</text>
  <text x="42" y="160" font-family="'Cascadia Mono', monospace" font-size="11" fill="#1e293b">40</text>
  <text x="42" y="128" font-family="'Cascadia Mono', monospace" font-size="11" fill="#1e293b">60</text>
  <text x="42" y="96" font-family="'Cascadia Mono', monospace" font-size="11" fill="#1e293b">80</text>
  <text x="35" y="64" font-family="'Cascadia Mono', monospace" font-size="11" fill="#1e293b">100</text>

  <!-- Runner A curve (concave down: fast start, slows near end) -->
  <path d="M 70 220 C 130 150, 200 125, 270 115 C 330 106, 380 85, 420 60" fill="none" stroke="#db2777" stroke-width="2.6" />

  <!-- Runner B curve (concave up: slow start, accelerates near end) -->
  <path d="M 70 220 C 150 205, 240 185, 290 160 C 350 130, 390 95, 420 60" fill="none" stroke="#0284c7" stroke-width="2.6" />

  <!-- Tie endpoint -->
  <circle cx="420" cy="60" r="4.5" fill="#1e293b" />
  <rect x="340" y="38" width="150" height="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="3" />
  <text x="346" y="52" font-family="'Cascadia Mono', monospace" font-size="11" font-weight="bold" fill="#1e293b">Tie (14 s, 100 m)</text>

  <!-- Runner Labels -->
  <rect x="235" y="100" width="85" height="18" fill="#ffffff" />
  <text x="238" y="114" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#db2777">Runner A</text>

  <rect x="245" y="170" width="85" height="18" fill="#ffffff" />
  <text x="248" y="184" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">Runner B</text>

  <text x="270" y="265" font-family="Aptos, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Figure: Position Graphs of Runners A and B</text>
</svg>