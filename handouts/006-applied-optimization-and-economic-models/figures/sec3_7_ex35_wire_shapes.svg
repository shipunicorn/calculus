<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="580" height="220" role="img" style="background-color: #ffffff; display: block; margin: 0 auto;">
<title>Wire Cut into Square and Equilateral Triangle</title>
<desc>A 10 meter wire cut into length x for a square and 10 minus x for an equilateral triangle.</desc>
<rect width="580" height="220" fill="#ffffff" />
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db2777" />
  </marker>
  <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" />
  </marker>
</defs>

    <!-- Top: 10 m Wire -->
    <rect x="20" y="15" width="540" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="290" y="34" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Total Wire Length = 10 m</text>
    
    <!-- Wire line -->
    <line x1="50" y1="52" x2="270" y2="52" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <line x1="280" y1="52" x2="530" y2="52" stroke="#ea580c" stroke-width="5" stroke-linecap="round" />
    <!-- Cut indicator -->
    <line x1="275" y1="42" x2="275" y2="62" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 2" />
    <text x="275" y="73" font-family="Aptos, sans-serif" font-size="10" fill="#dc2626" font-weight="bold" text-anchor="middle">Cut</text>
    
    <text x="160" y="44" font-family="Aptos, sans-serif" font-size="11" font-style="italic" fill="#0284c7" font-weight="600" text-anchor="middle">x (for square)</text>
    <text x="405" y="44" font-family="Aptos, sans-serif" font-size="11" font-style="italic" fill="#ea580c" font-weight="600" text-anchor="middle">10 − x (for equilateral triangle)</text>

    <!-- Bottom Left: Square -->
    <rect x="25" y="98" width="255" height="110" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <rect x="65" y="120" width="55" height="55" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5" />
    <text x="92" y="114" font-family="Aptos, sans-serif" font-size="11" font-style="italic" fill="#0284c7" text-anchor="middle">x / 4</text>
    <text x="35" y="152" font-family="Aptos, sans-serif" font-size="11" font-style="italic" fill="#0284c7" text-anchor="start">x / 4</text>
    <text x="195" y="135" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Square</text>
    <text x="195" y="155" font-family="Aptos, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Perimeter = x</text>
    <text x="195" y="175" font-family="Aptos, sans-serif" font-size="11.5" font-weight="600" fill="#0f766e" text-anchor="middle">Area = x² / 16</text>

    <!-- Bottom Right: Equilateral Triangle -->
    <rect x="295" y="98" width="265" height="110" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" />
    <polygon points="330,175 390,175 360,123" fill="ffedd5" stroke="#ea580c" stroke-width="2.5" />
    <text x="360" y="192" font-family="Aptos, sans-serif" font-size="11" font-style="italic" fill="#ea580c" text-anchor="middle">(10 − x) / 3</text>
    <text x="470" y="135" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">Equilateral Δ</text>
    <text x="470" y="155" font-family="Aptos, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Perimeter = 10 − x</text>
    <text x="470" y="175" font-family="Aptos, sans-serif" font-size="11" font-weight="600" fill="#0f766e" text-anchor="middle">Area = √3/36 · (10 − x)²</text>
    
</svg>