<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="620" height="220" role="img" style="background-color: #ffffff; display: block; margin: 0 auto;">
<title>Four-Pen Fencing Configurations and Model</title>
<desc>Exploration of rectangular pasture divided into four pens by internal fences with total perimeter 750 feet.</desc>
<rect width="620" height="220" fill="#ffffff" />
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db2777" />
  </marker>
  <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" />
  </marker>
</defs>

    <!-- Left Panel: Sample Explorations -->
    <rect x="15" y="15" width="265" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="147" y="36" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Part (a): Sample Configurations</text>
    
    <!-- Shallow / Wide: x = 50, y = 250 => 5(50)+2(250)=750, Area = 12,500 -->
    <text x="147" y="54" font-family="Aptos, sans-serif" font-size="10.5" fill="#047857" font-weight="600" text-anchor="middle">Shallow (x = 50, y = 250): Area = 12,500 ft²</text>
    <rect x="35" y="60" width="225" height="24" fill="#ecfdf5" stroke="#dc2626" stroke-width="1.8" />
    <line x1="91" y1="60" x2="91" y2="84" stroke="#dc2626" stroke-width="1.5" />
    <line x1="147" y1="60" x2="147" y2="84" stroke="#dc2626" stroke-width="1.5" />
    <line x1="203" y1="60" x2="203" y2="84" stroke="#dc2626" stroke-width="1.5" />

    <!-- Deep / Narrow: x = 100, y = 125 => 5(100)+2(125)=750, Area = 12,500 -->
    <text x="147" y="106" font-family="Aptos, sans-serif" font-size="10.5" fill="#047857" font-weight="600" text-anchor="middle">Deep (x = 100, y = 125): Area = 12,500 ft²</text>
    <rect x="80" y="112" width="135" height="48" fill="#ecfdf5" stroke="#dc2626" stroke-width="1.8" />
    <line x1="114" y1="112" x2="114" y2="160" stroke="#dc2626" stroke-width="1.5" />
    <line x1="147" y1="112" x2="147" y2="160" stroke="#dc2626" stroke-width="1.5" />
    <line x1="181" y1="112" x2="181" y2="160" stroke="#dc2626" stroke-width="1.5" />

    <text x="147" y="190" font-family="Aptos, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Estimate: Max area ≥ 12,500 ft²</text>

    <!-- Right Panel: General 4-Pen Model -->
    <rect x="290" y="15" width="320" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="450" y="36" font-family="Aptos, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Part (b): General Four-Pen Model</text>

    <!-- Outer rectangle -->
    <rect x="330" y="65" width="240" height="75" fill="#f0fdf4" stroke="#dc2626" stroke-width="2.5" />
    <!-- 3 Internal Dividers -->
    <line x1="390" y1="65" x2="390" y2="140" stroke="#dc2626" stroke-width="2.2" />
    <line x1="450" y1="65" x2="450" y2="140" stroke="#dc2626" stroke-width="2.2" />
    <line x1="510" y1="65" x2="510" y2="140" stroke="#dc2626" stroke-width="2.2" />

    <!-- Pen labels -->
    <text x="360" y="106" font-family="Aptos, sans-serif" font-size="11" fill="#15803d" font-weight="600" text-anchor="middle">Pen 1</text>
    <text x="420" y="106" font-family="Aptos, sans-serif" font-size="11" fill="#15803d" font-weight="600" text-anchor="middle">Pen 2</text>
    <text x="480" y="106" font-family="Aptos, sans-serif" font-size="11" fill="#15803d" font-weight="600" text-anchor="middle">Pen 3</text>
    <text x="540" y="106" font-family="Aptos, sans-serif" font-size="11" fill="#15803d" font-weight="600" text-anchor="middle">Pen 4</text>

    <!-- Dimension annotations -->
    <text x="450" y="56" font-family="Aptos, sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#1e293b" text-anchor="middle">y (width)</text>
    <text x="318" y="106" font-family="Aptos, sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#1e293b" text-anchor="end">x</text>
    
    <text x="450" y="165" font-family="Aptos, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Constraint: 5x + 2y = 750 ⇒ y = 375 − 2.5x</text>
    <text x="450" y="188" font-family="Aptos, sans-serif" font-size="10.5" font-weight="bold" fill="#0284c7" text-anchor="middle">Max Area at x = 75 ft, y = 187.5 ft: A = 14,062.5 ft²</text>
    
</svg>